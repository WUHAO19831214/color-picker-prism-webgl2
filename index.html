<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Color picker · prism</title>
  <link rel="stylesheet" href="./styles/prism.css" />
</head>
<body>
  <header class="topbar">
    <span>prism · local replica</span>
    <span>webgl2 optics</span>
  </header>

  <main class="shell">
    <button id="btn-prev" class="nav-arrow" type="button" aria-label="Previous variant">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M10 3.5L5.5 8L10 12.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <section class="card-wrap">
      <div class="card-header">
        <span>prism</span>
      </div>

      <div id="prism-stage" class="card-frame"></div>

      <div class="card-footer">
        <span class="card-tag">color picker</span>
        <div class="variant-controls">
          <div id="variant-dots" class="dots"></div>
          <span id="variant-count" class="variant-count">3/3</span>
        </div>
      </div>
    </section>

    <button id="btn-next" class="nav-arrow" type="button" aria-label="Next variant">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M6 3.5L10.5 8L6 12.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
  </main>

  <footer class="bottombar">
    <span>drag prism to rotate · h / l for variants</span>
  </footer>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
